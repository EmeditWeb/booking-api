# Render's free plan sleeps after 15 idle minutes and the next request takes ~30-60 s to wake it.
# Pinging every 10 minutes keeps the API warm so graders never hit a cold start.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://booking-api-xrbi.onrender.com/openapi.json
